bundle:
  name: erp-auto-mapper

variables:
  cluster_id:
    description: Existing cluster ID for notebook jobs
  catalog:
    description: Unity Catalog name for Delta tables and UDFs
    default: erp_auto_mapper_dev
  schema:
    description: Schema name within the catalog
    default: mapper

targets:
  dev:
    default: true
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      catalog: erp_auto_mapper_dev

  staging:
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      catalog: erp_auto_mapper_staging

  prod:
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      catalog: erp_auto_mapper_prod

resources:
  apps:
    erp-auto-mapper-app:
      name: erp-auto-mapper-app
      description: ERP Auto Mapper REST API
      source_code_path: .

  jobs:
    erp-auto-mapper-batch-map:
      name: erp-auto-mapper-batch-map
      description: Batch ERP field mapping job
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: batch_map
          notebook_task:
            notebook_path: notebooks/05_batch_job.py
          existing_cluster_id: ${var.cluster_id}

    erp-auto-mapper-setup:
      name: erp-auto-mapper-setup
      description: One-time setup — create tables and register UDFs
      tasks:
        - task_key: create_tables
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: deploy/sql/run_ddl.py
        - task_key: register_udfs
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: deploy/udfs/register_udfs.py
