bundle:
  name: erp-auto-mapper

variables:
  cluster_id:
    description: Existing cluster ID for notebook and spark jobs
  catalog:
    description: Unity Catalog name for Delta tables and UDFs
    default: erp_auto_mapper_dev
  schema:
    description: Schema name within the catalog
    default: mapper

targets:
  dev:
    default: true
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      cluster_id: "0408-193055-0yvg6aw0"
      catalog: erp_auto_mapper_dev
      schema: mapper

  staging:
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      cluster_id: "0408-193055-0yvg6aw0"
      catalog: erp_auto_mapper_staging
      schema: mapper

  prod:
    workspace:
      host: https://adb-270181971930646.6.azuredatabricks.net
      profile: azure_fieldeng
    variables:
      cluster_id: "0408-193055-0yvg6aw0"
      catalog: erp_auto_mapper_prod
      schema: mapper

resources:
  apps:
    erp-auto-mapper-app:
      name: erp-auto-mapper-app
      description: ERP Auto Mapper REST API
      source_code_path: .

  jobs:
    erp-auto-mapper-batch-map:
      name: erp-auto-mapper-batch-map
      description: Batch ERP field mapping job
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
      tasks:
        - task_key: batch_map
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: notebooks/05_batch_job.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

    erp-auto-mapper-setup:
      name: erp-auto-mapper-setup
      description: One-time setup — create tables and register UDFs
      tasks:
        - task_key: create_tables
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: deploy/sql/run_ddl.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
        - task_key: register_udfs
          existing_cluster_id: ${var.cluster_id}
          depends_on:
            - task_key: create_tables
          spark_python_task:
            python_file: deploy/udfs/register_udfs.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

    erp-ka-setup:
      name: erp-ka-setup
      description: One-time — create VS index and log KA agent to MLflow
      tasks:
        - task_key: setup_ka
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: notebooks/06_knowledge_assistant.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
