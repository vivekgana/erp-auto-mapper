[project]
name = "erp-auto-mapper"
version = "0.1.0"
description = "AI-powered ERP-to-CDM field mapping engine — Databricks Marketplace native + REST API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "ERP Auto Mapper", email = "marketplace@erp-auto-mapper.io"},
]
keywords = ["erp", "cdm", "mapping", "databricks", "audit", "sap", "oracle"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/vivekgana/erp-auto-mapper"
Repository = "https://github.com/vivekgana/erp-auto-mapper"
Documentation = "https://github.com/vivekgana/erp-auto-mapper#readme"
Issues = "https://github.com/vivekgana/erp-auto-mapper/issues"

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.20.0",
    "pyarrow>=15.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
]
formats = [
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "fastavro>=1.9.0",
]
ka = [
    "erp-auto-mapper[databricks]",
    "mlflow>=2.14.0",
]
all = [
    "erp-auto-mapper[databricks,api,formats,ka]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
erp-auto-mapper-serve = "erp_auto_mapper.api.app:serve_cli"
erp-auto-mapper-register-udfs = "erp_auto_mapper.databricks.udfs:register_udfs_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_auto_mapper"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
